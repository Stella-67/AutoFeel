<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoFeel Settings</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <div class="container">
    <h1>AutoFeel Settings</h1>

    <div class="section">
      <label for="llm-provider">LLM Provider:</label>
      <select id="llm-provider">
        <option value="">-- Please Select --</option>
        <option value="openai">OpenAI (GPT)</option>
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="custom">Custom API</option>
      </select>
    </div>

    <div class="section" id="api-key-section" style="display: none;">
      <label for="api-key">API Key:</label>
      <input type="password" id="api-key" placeholder="Enter your API Key">
      <button id="toggle-key" class="btn-small">Show</button>
    </div>

    <div class="section" id="custom-endpoint-section" style="display: none;">
      <label for="api-endpoint">API Endpoint:</label>
      <input type="text" id="api-endpoint" placeholder="https://api.example.com/v1/chat/completions">
    </div>

    <div class="section" id="model-section" style="display: none;">
      <label for="model-name">Model Name:</label>
      <input type="text" id="model-name" placeholder="e.g. gpt-4, claude-3-sonnet">
    </div>

    <div class="section" id="prompt-section" style="display: none;">
      <label for="system-prompt">System Prompt (Optional):</label>
      <textarea id="system-prompt" rows="3" placeholder="Set a default system prompt..."></textarea>
    </div>

    <div class="button-group">
      <button id="test-btn" class="btn-secondary" disabled>Test Connection</button>
      <button id="save-btn" class="btn-primary" disabled>Save Settings</button>
    </div>

    <div id="status-message" class="status-message"></div>

    <div class="usage-info">
      <h3>Usage Instructions</h3>
      <p>1. Select LLM provider and enter API Key</p>
      <p>2. Click "Test Connection" to verify API</p>
      <p>3. Click "Save Settings" to save configuration</p>
      <p>4. Press <kbd>Option+C</kbd> (Mac) or <kbd>Alt+C</kbd> (Windows) on any webpage to send content to LLM</p>
    </div>
  </div>

  <script src="src/popup.js"></script>
</body>
</html>
