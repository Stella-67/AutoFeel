<!DOCTYPE html>
<html>
<head>
  <title>测试表单 - Application Form Auto-Fill</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      margin-top: 5px;
      padding: 10px;
      font-size: 14px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #4f46e5;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>测试申请表单</h1>
  <p>使用这个表单测试 Auto-Fill 扩展</p>

  <form>
    <label for="about_you">请介绍一下你自己：</label>
    <textarea id="about_you" name="about_you" placeholder="在这里输入你的回答..."></textarea>

    <label for="motivation">为什么你想要这个职位？</label>
    <textarea id="motivation" name="motivation" placeholder="在这里输入你的回答..."></textarea>

    <label for="challenge">描述一个你克服的挑战：</label>
    <textarea id="challenge" name="challenge" placeholder="在这里输入你的回答..."></textarea>

    <label for="achievement">你最大的成就是什么？</label>
    <textarea id="achievement" name="achievement" placeholder="在这里输入你的回答..."></textarea>

    <label for="skills">你有哪些相关技能？</label>
    <textarea id="skills" name="skills" placeholder="在这里输入你的回答..."></textarea>

    <button type="submit">提交</button>
  </form>
</body>
</html>
